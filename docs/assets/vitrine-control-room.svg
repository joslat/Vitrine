<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: MIT -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
  <title id="title">VITRINE control-room architecture</title>
  <desc id="desc">The implemented Avalonia control room. Demo, workflow, offline evaluation, paid live evaluation, safety probes, and ablation commands feed one run coordinator. Adapters normalize agent tool calls, workflow events, and evaluation progress into a sanitized event stream. View models drive the graph, timeline, details, evaluation board, replay, and exports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111c34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57e6d3"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa7ff"/>
    </marker>
    <style>
      text { font-family: Inter, Aptos, "Segoe UI", sans-serif; fill: #eef4ff; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #57e6d3; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 17px; fill: #aebbd2; }
      .heading { font-size: 20px; font-weight: 750; }
      .body { font-size: 15px; fill: #cbd7eb; }
      .small { font-size: 13px; fill: #aebbd2; }
      .box { fill: #15233d; stroke: #304465; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .box-ready { fill: #112d33; stroke: #37bda9; stroke-width: 1.5; rx: 18; }
      .box-new { fill: #211d38; stroke: #7566bd; stroke-width: 1.5; rx: 18; }
      .chip { fill: #1f3152; stroke: #405982; stroke-width: 1; rx: 10; }
      .line { fill: none; stroke: #7aa7ff; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #2e4163; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="790" fill="url(#bg)" rx="28"/>
  <rect x="44" y="38" width="218" height="32" rx="16" fill="#133630" stroke="#3fcab5"/>
  <text x="153" y="60" text-anchor="middle" class="eyebrow">SHIPPED · ONE EVIDENCE MODEL</text>
  <text x="44" y="112" class="title">VITRINE control room</text>
  <text x="44" y="143" class="subtitle">The Avalonia shell projects VITRINE’s execution and evaluation evidence as the only source of truth.</text>

  <rect class="box" x="44" y="196" width="245" height="466"/>
  <text x="68" y="231" class="heading">Run selection</text>
  <text x="68" y="257" class="small">Gatekeeper shell pattern</text>
  <rect class="chip" x="68" y="284" width="197" height="55"/>
  <text x="86" y="307" class="body">Demo 01</text>
  <text x="86" y="327" class="small">single agent + tools</text>
  <rect class="chip" x="68" y="352" width="197" height="55"/>
  <text x="86" y="375" class="body">Demo 02</text>
  <text x="86" y="395" class="small">five-executor workflow</text>
  <rect class="chip" x="68" y="420" width="197" height="55"/>
  <text x="86" y="443" class="body">Evaluation suite</text>
  <text x="86" y="463" class="small">5 gates + quality diagnostic + 43 controls</text>
  <rect class="chip" x="68" y="488" width="197" height="55"/>
  <text x="86" y="511" class="body">Ablation</text>
  <text x="86" y="531" class="small">break · detect · restore</text>
  <line class="divider" x1="68" y1="570" x2="265" y2="570"/>
  <text x="68" y="601" class="small">Offline is the default path.</text>
  <text x="68" y="625" class="small">Paid live requires readiness + confirmation.</text>

  <path class="line" d="M 289 430 C 330 430, 335 430, 369 430"/>

  <rect class="box-new" x="370" y="196" width="268" height="466"/>
  <text x="394" y="231" class="heading">Run coordinator</text>
  <text x="394" y="257" class="small">implemented UI application service</text>
  <rect class="chip" x="394" y="284" width="220" height="64"/>
  <text x="412" y="309" class="body">Demo 01 adapter</text>
  <text x="412" y="331" class="small">agent + typed tool events</text>
  <rect class="box-ready" x="394" y="365" width="220" height="64"/>
  <text x="412" y="390" class="body">Demo 02 adapter</text>
  <text x="412" y="412" class="small">typed executor + route events</text>
  <rect class="chip" x="394" y="446" width="220" height="64"/>
  <text x="412" y="471" class="body">Evaluation adapter</text>
  <text x="412" y="493" class="small">progress + result events</text>
  <rect class="chip" x="394" y="527" width="220" height="64"/>
  <text x="412" y="552" class="body">Cancellation + replay</text>
  <text x="412" y="574" class="small">one lifecycle for every mode</text>
  <text x="394" y="625" class="small">Purple = orchestration / projection</text>

  <path class="line" d="M 638 430 C 680 430, 681 430, 718 430"/>

  <rect class="box-new" x="719" y="196" width="283" height="466"/>
  <text x="743" y="231" class="heading">Sanitized event stream</text>
  <text x="743" y="257" class="small">one immutable event contract</text>
  <rect class="chip" x="743" y="284" width="235" height="54"/>
  <text x="761" y="307" class="body">sequence · timestamp · run</text>
  <text x="761" y="327" class="small">stable ordering and identity</text>
  <rect class="chip" x="743" y="352" width="235" height="54"/>
  <text x="761" y="375" class="body">source · target · kind</text>
  <text x="761" y="395" class="small">graph movement and filters</text>
  <rect class="chip" x="743" y="420" width="235" height="54"/>
  <text x="761" y="443" class="body">summary · detail · payload</text>
  <text x="761" y="463" class="small">structured inspection</text>
  <rect x="743" y="500" width="235" height="116" rx="14" fill="#341b29" stroke="#c05f86"/>
  <text x="761" y="528" class="heading">Redaction boundary</text>
  <text x="761" y="554" class="small">Never retain, render, export, log,</text>
  <text x="761" y="576" class="small">or hash a key or endpoint URL.</text>
  <text x="761" y="598" class="small">Deployment name only.</text>

  <path class="line" d="M 1002 430 C 1043 430, 1045 430, 1082 430"/>

  <rect class="box-new" x="1083" y="196" width="313" height="466"/>
  <text x="1107" y="231" class="heading">Live evidence views</text>
  <text x="1107" y="257" class="small">Avalonia view models + views</text>
  <rect class="chip" x="1107" y="284" width="126" height="84"/>
  <text x="1125" y="312" class="body">Graph</text>
  <text x="1125" y="335" class="small">nodes</text>
  <text x="1125" y="354" class="small">active edges</text>
  <rect class="chip" x="1246" y="284" width="126" height="84"/>
  <text x="1264" y="312" class="body">Timeline</text>
  <text x="1264" y="335" class="small">tools</text>
  <text x="1264" y="354" class="small">guards</text>
  <rect class="chip" x="1107" y="382" width="126" height="84"/>
  <text x="1125" y="410" class="body">Details</text>
  <text x="1125" y="433" class="small">inputs</text>
  <text x="1125" y="452" class="small">outputs</text>
  <rect class="chip" x="1246" y="382" width="126" height="84"/>
  <text x="1264" y="410" class="body">Eval board</text>
  <text x="1264" y="433" class="small">missing ≠ 0</text>
  <text x="1264" y="452" class="small">chance floors</text>
  <rect class="chip" x="1107" y="480" width="265" height="62"/>
  <text x="1125" y="506" class="body">Replay from immutable events</text>
  <text x="1125" y="528" class="small">same model, no second execution</text>
  <rect class="chip" x="1107" y="556" width="265" height="62"/>
  <text x="1125" y="582" class="body">Export HTML + machine data</text>
  <text x="1125" y="604" class="small">sanitized and absence-aware</text>

  <text x="44" y="720" class="eyebrow">IMPLEMENTATION RULE</text>
  <text x="44" y="752" class="subtitle">The UI observes the same runtime and evaluation evidence used by the CLI. It never invents a second scoring path.</text>
  <rect x="1132" y="708" width="264" height="50" rx="14" fill="url(#accent)"/>
  <text x="1264" y="740" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#071321">CLI TRUTH → UI PROJECTION</text>
</svg>
