name: credential-free-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      AZURE_OPENAI_ENDPOINT: ""
      AZURE_OPENAI_API_KEY: ""
      AZURE_OPENAI_DEPLOYMENT: ""
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ""
      VITRINE_CONFIRM_PAID: "0"
      VITRINE_RUN_LIVE_MODEL_TESTS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verify publication boundary
        if: github.repository == 'joslat/Vitrine'
        shell: pwsh
        run: ./eng/verify-publication.ps1
      - name: Verify documentation links
        shell: pwsh
        run: ./eng/verify-doc-links.ps1
      - name: Restore locked dependencies
        run: dotnet restore AgentEval.VitrineDemo.slnx --locked-mode
      - name: Build
        run: dotnet build AgentEval.VitrineDemo.slnx -c Release --no-restore -warnaserror
      - name: Test credential-free lane
        run: >-
          dotnet test tests/AgentEval.VitrineDemo.Tests/AgentEval.VitrineDemo.Tests.csproj
          -c Release --no-build --no-restore
          --filter "Category!=LiveModel"
          --results-directory "${{ runner.temp }}/vitrine-test-results"
          --logger "trx;LogFileName=credential-free.trx"
      - name: Require a complete zero-skipped test receipt
        shell: pwsh
        run: |
          $trxPath = "${{ runner.temp }}/vitrine-test-results/credential-free.trx"
          if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
            throw "Test receipt was not produced: $trxPath"
          }
          [xml] $trx = Get-Content -Raw -LiteralPath $trxPath
          $counters = $trx.TestRun.ResultSummary.Counters
          if ($null -eq $counters) { throw "TRX receipt has no counters: $trxPath" }
          $total = [int] $counters.total
          $executed = [int] $counters.executed
          $passed = [int] $counters.passed
          $nonPassing = @(
            'failed', 'error', 'timeout', 'aborted', 'inconclusive', 'passedButRunAborted',
            'notRunnable', 'notExecuted', 'disconnected', 'warning', 'completed',
            'inProgress', 'pending', 'skipped'
          ) | ForEach-Object {
            $value = $counters.GetAttribute($_)
            if ([string]::IsNullOrWhiteSpace($value)) { 0 } else { [int] $value }
          } | Measure-Object -Sum
          if ($total -le 0 -or $executed -ne $total -or $passed -ne $total -or $nonPassing.Sum -ne 0) {
            throw "Tests were not all executed and passing: total=$total executed=$executed passed=$passed nonPassing=$($nonPassing.Sum)."
          }
          Write-Host "Verified $passed/$total tests passed with zero skipped or inconclusive results."
      - name: Run admitted self-test
        run: >-
          dotnet run --project src/AgentEval.VitrineDemo.Evals
          -c Release --no-build --no-restore -- --self-test
      - name: Run full offline suite
        run: >-
          dotnet run --project src/AgentEval.VitrineDemo.Evals
          -c Release --no-build --no-restore -- --all
      - name: Prove catalogue ablation is detected and isolated
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & dotnet run --project src/AgentEval.VitrineDemo.Evals `
            -c Release --no-build --no-restore -- --ablate-catalogue
          if ($LASTEXITCODE -ne 1) {
            throw "Catalogue ablation must be detected with exit code 1; observed $LASTEXITCODE."
          }
          Write-Host "Catalogue defect was detected as expected; rerunning the restored offline suite."
          & dotnet run --project src/AgentEval.VitrineDemo.Evals `
            -c Release --no-build --no-restore -- --all
          if ($LASTEXITCODE -ne 0) {
            throw "Restored offline suite failed after catalogue ablation with exit code $LASTEXITCODE."
          }
      - name: Upload test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-free-test-receipt
          path: ${{ runner.temp }}/vitrine-test-results/credential-free.trx
          if-no-files-found: warn
          retention-days: 14
